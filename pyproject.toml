[project]
name = "nosql-lab"
version = "0.1.0"
description = "NoSQL work for DS2022"
readme = "README.md"
authors = [
    { name = "miaykang", email = "sdq6nt@virginia.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "pymongo>=4.18.3",
]

[project.scripts]
nosql-lab = "nosql_lab:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
